apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-alb-ingress-annotations
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
  variables:
    - name: annotations
      expression: object.metadata.?annotations.orValue({})
  validations:
    - message: Ingresses must define the required ALB listener, redirect, and TLS policy annotations.
      expression: >-
        variables.annotations[?'alb.ingress.kubernetes.io/listen-ports'].orValue('') == '[{"HTTP": 80}, {"HTTPS": 443}]' &&
        variables.annotations[?'alb.ingress.kubernetes.io/ssl-redirect'].orValue('') == '443' &&
        variables.annotations[?'alb.ingress.kubernetes.io/ssl-policy'].orValue('') == 'ELBSecurityPolicy-TLS13-1-2-2021-06'
