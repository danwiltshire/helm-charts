apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-github-app
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-app
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: argocd-github-app
    kind: SecretStore
  target:
    name: argocd-github-app
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        githubAppID: "5760331"
        githubAppInstallationID: "181971197"
  data:
  - secretKey: githubAppPrivateKey
    remoteRef:
      key: /github/danwiltshire/app/danforge-argocd/private-key
