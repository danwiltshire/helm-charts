apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nonprod-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/danwiltshire/helm-charts.git
      revision: HEAD
      files:
      - path: apps/*/envs/*.yaml
      - path: apps/*/envs/prod.yaml
        exclude: true
      - path: apps/*/envs/preview.yaml
        exclude: true
      values:
        app: '{{index .path.segments 1}}'
        env: '{{trimSuffix ".yaml" .path.filename}}'
  template:
    metadata:
      name: '{{.values.app}}-{{.values.env}}'
    spec:
      project: default
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      - group: apps
        kind: DaemonSet
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      source:
        repoURL: https://github.com/danwiltshire/helm-charts.git
        targetRevision: HEAD
        path: 'apps/{{.values.app}}'
        helm:
          valueFiles:
          - 'envs/{{.values.env}}.yaml'
      destination:
        name: nonprod
        namespace: '{{.values.app}}-{{.values.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            eks.amazonaws.com/pod-readiness-gate-inject: enabled
        syncOptions:
        - CreateNamespace=true