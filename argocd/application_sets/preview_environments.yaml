apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/danwiltshire/helm-charts.git
          revision: HEAD
          files:
          - path: apps/*/envs/preview.yaml
          values:
            app: '{{index .path.segments 1}}'
      # Assumes each app's source repo is named after its directory under apps/.
      - pullRequest:
          github:
            owner: danwiltshire
            repo: '{{.values.app}}'
            appSecretName: argocd-github-app
            labels:
            - preview
  template:
    metadata:
      name: '{{.values.app}}-pr-{{.number}}'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      annotations:
        danforge.net/preview-repository: 'https://github.com/danwiltshire/{{.values.app}}'
        danforge.net/preview-sha: '{{.head_sha}}'
        danforge.net/preview-url: 'https://{{.values.app}}-{{.number}}.preview.danforge.net'
        notifications.argoproj.io/subscribe.preview-creating.github: ""
        notifications.argoproj.io/subscribe.preview-ready.github: ""
        notifications.argoproj.io/subscribe.preview-failed.github: ""
        notifications.argoproj.io/subscribe.preview-deleting.github: ""
    spec:
      project: default
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      - group: apps
        kind: StatefulSet
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      - group: apps
        kind: DaemonSet
        jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
      sources:
      - repoURL: 'https://github.com/danwiltshire/{{.values.app}}.git'
        targetRevision: '{{.head_sha}}'
        ref: app
      - repoURL: https://github.com/danwiltshire/helm-charts.git
        targetRevision: HEAD
        path: 'apps/{{.values.app}}'
        helm:
          valueFiles:
          - envs/preview.yaml
          parameters:
          - name: domainName
            value: '{{.values.app}}-{{.number}}.preview.danforge.net'
          - name: imageTag
            value: '{{.head_sha | trunc 7}}'
            forceString: true
      destination:
        name: prod
        namespace: '{{.values.app}}-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            eks.amazonaws.com/pod-readiness-gate-inject: enabled
        syncOptions:
        - CreateNamespace=true