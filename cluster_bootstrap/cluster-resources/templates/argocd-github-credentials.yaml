apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-github-app
  namespace: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-app
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: argocd-github-app
    kind: SecretStore
  target:
    name: argocd-github-app
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
  data:
    - secretKey: githubAppID
      remoteRef:
        key: /github/danwiltshire/app/danforge-argocd/metadata
        property: APP_ID
    - secretKey: githubAppInstallationID
      remoteRef:
        key: /github/danwiltshire/app/danforge-argocd/metadata
        property: INSTALLATION_ID
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: /github/danwiltshire/app/danforge-argocd/private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-creds
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: argocd-github-app
    kind: SecretStore
  target:
    name: argocd-webhook-creds-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: '/argocd/{{ required "argocdEnvironment is required" .Values.argocdEnvironment }}/webhook-shared-secret'
