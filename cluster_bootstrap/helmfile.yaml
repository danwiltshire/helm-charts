environments:
  prod:
    values:
      - argocdUrl: https://argocd-258285bb-426576223955.eks-capabilities.eu-west-2.amazonaws.com
  nonprod:
    values:
      - argocdUrl: https://argocd-258285bb-426576223955.eks-capabilities.eu-west-2.amazonaws.com

---
repositories:
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: stakater
    url: https://stakater.github.io/stakater-charts

releases:
  - name: keda
    namespace: keda
    chart: kedacore/keda
    version: 2.21.0
    createNamespace: true
    wait: true
    timeout: 600

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 2.15.0
    values:
      - serviceAccount:
          name: external-secrets
    createNamespace: true
    wait: true
    timeout: 600

  - name: reloader
    namespace: reloader
    chart: stakater/reloader
    version: 2.2.20
    values:
      - reloader:
          reloadStrategy: annotations
          enableHA: true
          reloadOnCreate: true
          syncAfterRestart: true
          deployment:
            replicas: 2
    createNamespace: true
    wait: true
    timeout: 600

  - name: cluster-resources
    namespace: kube-system
    chart: ./cluster-resources
    needs:
      - external-secrets/external-secrets
    values:
      - cluster-resources-values.yaml.gotmpl
    createNamespace: false
    wait: true