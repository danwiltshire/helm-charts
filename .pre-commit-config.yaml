---
repos:
  - repo: local
    hooks:
      - id: helm-dependencies
        name: prepare Helm dependencies
        entry: bash scripts/build-chart-dependencies.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/dadav/helm-schema
    rev: 0.24.0
    hooks:
      - id: helm-schema
        pass_filenames: false
        args:
          - --chart-search-root=apps
          - --keep-existing-dep-schemas
          - --add-schema-reference
          - --skip-auto-generation=additionalProperties

  - repo: local
    hooks:
      - id: env-schema
        name: generate environment override schemas
        entry: python3 scripts/generate_env_schema.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint

  - repo: local
    hooks:
      - id: env-schema-reference
        name: update schema reference in env values files
        entry: scripts/add-env-schema-reference.sh
        language: script
        files: ^apps/[^/]+/envs/[^/]+\.ya?ml$

      - id: kyverno
        name: validate application manifests with Kyverno
        entry: bash scripts/validate-kyverno.sh
        language: system
        pass_filenames: false
