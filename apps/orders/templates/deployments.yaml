{{- range $component := list
  (dict "name" "orders" "mainClass" "com.example.orders.OrdersApplication")
  (dict "name" "catalog" "mainClass" "com.example.orders.CatalogApplication")
  (dict "name" "worker" "mainClass" "com.example.orders.WorkerApplication") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-{{ $component.name }}
  annotations:
    secret.reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-{{ $component.name }}
  template:
    metadata:
      labels:
        app: orders-{{ $component.name }}
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: {{ $component.name }}
          image: {{ printf "%s:%s" (required "imageRepository is required" $.Values.imageRepository) (required "api.imageTag is required" $.Values.api.imageTag) | quote }}
          args:
            - {{ $component.mainClass | quote }}
          envFrom:
            - secretRef:
                name: orders-database
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://orders-postgres:5432/orders
            - name: SPRING_DATASOURCE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
            - name: SPRING_RABBITMQ_HOST
              value: orders-rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: "$(RABBITMQ_DEFAULT_USER)"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "$(RABBITMQ_DEFAULT_PASS)"
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
{{- end }}
