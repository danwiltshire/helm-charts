apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ui
  template:
    metadata:
      labels:
        app: orders-ui
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: ui
          image: {{ printf "%s:%s" (required "imageRepository is required" .Values.imageRepository) (required "ui.imageTag is required" .Values.ui.imageTag) | quote }}
          env:
            - name: CATALOG_API_URL
              value: http://orders-catalog:8080
            - name: ORDERS_API_URL
              value: http://orders-orders:8080
          ports:
            - name: http
              containerPort: 3000
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders-ui
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
spec:
  selector:
    app: orders-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
