apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-deployment
spec:
  selector:
    matchLabels:
      app: hello-world
  replicas: 1
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        # website::tag::2:: Runs an HTTP server that responds with "Hello, World!" on port 5000
        - name: hello-world
          image: hashicorp/http-echo
          args:
            - "-text=Hello, World!"
            - "-listen=:5000"
          ports:
            - containerPort: 5000
