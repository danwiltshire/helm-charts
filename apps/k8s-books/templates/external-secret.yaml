{{- if .Values.awsSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: books-auth
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "awsSecret.region is required" .Values.awsSecret.region | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: books-auth
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef:
    name: books-auth
    kind: SecretStore
  target:
    name: books-auth
    creationPolicy: Owner
    template:
      type: Opaque
      mergePolicy: Merge
      metadata:
        annotations: {}
        labels: {}
  dataFrom:
    - extract:
        key: {{ required "awsSecret.remoteKey is required" .Values.awsSecret.remoteKey | quote }}
{{- end }}
