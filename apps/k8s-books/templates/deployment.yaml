apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-deployment
spec:
  selector:
    matchLabels:
      app: books
  replicas: 2
  template:
    metadata:
      labels:
        app: books
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: books
          image: {{ printf "%s:%s" (required "imageRepository is required" .Values.imageRepository) (required "imageTag is required" .Values.imageTag) | quote }}
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
